  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    /* ---------- أيقونة lucide مرسومة داخل React ----------
       لا نستخدم lucide.createIcons() إطلاقاً — كان يستبدل عناصر <i>
       بـ<svg> خارج علم React فينفجر removeChild عند أي إعادة رسم */
    const _lucideIcons = (window.lucide && (window.lucide.icons || window.lucide.Icons)) || {};
    const _iconPascal = (n) => String(n || '').split('-').map(s => s.charAt(0).toUpperCase() + s.slice(1)).join('');
    const Icon = ({ name, size = 16, className = '', style }) => {
      const def = _lucideIcons[_iconPascal(name)] || _lucideIcons[name];
      const node = Array.isArray(def) ? def : (def && def.iconNode);
      if (!node) {
        return <span className={className} style={{ display: 'inline-block', verticalAlign: 'middle', width: size, height: size, ...(style || {}) }} />;
      }
      return (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
          fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
          className={className} style={{ display: 'inline-block', verticalAlign: 'middle', ...(style || {}) }}>
          {node.map(([tag, attrs], i) => React.createElement(tag, { key: i, ...attrs }))}
        </svg>
      );
    };

    /* ---------- معاينة السكنات — تُعرض على شكل قطعة اللعبة ---------- */
    function SkinPreview({ category, uri, zoom = 1, ox = 0, oy = 0 }) {

      }
      const bg = {
        backgroundImage: `url(${uri})`,
        backgroundSize: `${Math.round(zoom * 100)}%`,
        backgroundPosition: `${50 + ox * 50}% ${50 + oy * 50}%`,
        backgroundRepeat: 'no-repeat',
      };
      const tile = (w, h, extra = {}) => (
        <div className="rounded-md shadow-md border border-black/40" style={{ width: w, height: h, ...bg, ...extra }}></div>
      );
      switch (category) {
        case 'okeyRoom':
          return (
            <div className="w-full h-full relative" style={bg}>

              <div className="absolute bottom-1 inset-x-0 text-center text-[10px] text-white/60">مشهد الغرفة كاملاً — يستبدل طاولة اللعب ومحيطها</div>

        case 'frame':

        case 'title':
          return (

        case 'chessBoard':

        case 'chessPieces':

        case 'okeyTile':

                  {[0,1,2,3,4,5].map(i => (

        case 'bgCheckers':

          );
        case 'tableBg':

    /* ==================== التطبيق الرئيسي ==================== */

      // فئات المتجر الحقيقية — مطابقة لـ StoreCategory في التطبيق

      // مطابق لما يخزنه التطبيق في imageBase64 — حد Firestore للوثيقة 1MB
      const encodeImageToBase64 = (dataUri) => new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const MAX = 1024;
          let w = img.width, h = img.height;
          if (Math.max(w, h) > MAX) { const s = MAX / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx2 = canvas.getContext('2d');
          ctx2.fillStyle = '#ffffff';
          ctx2.fillRect(0, 0, w, h);
          ctx2.drawImage(img, 0, 0, w, h);
          // JPEG بجودة تنازلية حتى نبقى دون ~900KB من base64
          for (const q of [0.82, 0.7, 0.55, 0.4]) {
            const out = canvas.toDataURL('image/jpeg', q).split(',')[1];
            if (out.length < 900000) return resolve(out);
            if (q === 0.4) return reject(new Error('الصورة كبيرة جداً — جرّب صورة أصغر'));
          }
        };
        img.onerror = () => reject(new Error('تعذّر قراءة الصورة'));

            url = await new Promise((resolve, reject) => {
              task.on('state_changed',
                (snap) => setSongUploadProgress(Math.round((snap.bytesTransferred / snap.totalBytes) * 100)),
                reject,
                async () => resolve(await getDownloadURL(task.snapshot.ref))

          const { collection, addDoc, serverTimestamp } = window.fbTools;
          await addDoc(collection(window.db, 'radio_songs'), {
            name: newSong.name,
            genre: newSong.genre,
            url: url,
            groupId: newSong.groupId,
            active: true,
            createdAt: serverTimestamp()

          const isPlus = r.plan === 'vipPlus';

                  }} className="flex gap-2">
                    <input name="absVal" type="number" placeholder="تعيين قيمة محددة..." className="inp flex-1" />
                    <button type="submit" className="btn btn-primary">تعيين</button>
                  </form>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: إهداء لحظي من الإدارة — يصل اللاعب وهو يلعب عبر claims */}
          {giftTarget && (
            <div className="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
              <div className="card w-full max-w-sm border-[#2b2b30]">
                <div className="px-5 py-4 border-b border-[#232327] flex items-center justify-between">
                  <div className="sec-title"><Icon name="gift"/> إهداء لحظي — {giftTarget.name}</div>
                  <button onClick={() => setGiftTarget(null)} className="text-zinc-500 hover:text-white"><Icon name="x" style={{width:16,height:16}}/></button>
                </div>
                <div className="p-5 space-y-4">
                  <p className="text-[11px] text-zinc-500 leading-5">
                    تُرسل عبر وثيقة claims وتصل اللاعب فوراً وهو داخل اللعبة
                    بإشعار «هدية من الإدارة 👑» — الرصيد يُضاف لحظياً.
                  </p>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="lbl">الرقائق 🪙</label>
                      <input type="number" min="0" value={giftTarget.giftChips}
                        onChange={(e) => setGiftTarget(p => ({...p, giftChips: e.target.value}))} className="inp" />
                    </div>
                    <div>
                      <label className="lbl">الجواهر 💎</label>
                      <input type="number" min="0" value={giftTarget.giftGems}
                        onChange={(e) => setGiftTarget(p => ({...p, giftGems: e.target.value}))} className="inp" />
                    </div>
                  </div>
                  <div className="grid grid-cols-4 gap-2">
                    {[1000, 5000, 25000, 100000].map(v => (
                      <button key={v} onClick={() => setGiftTarget(p => ({...p, giftChips: v}))} className="btn btn-sec btn-sm">{v >= 1000 ? `${v/1000}K` : v}</button>
                    ))}
                  </div>
                  <button onClick={sendAdminGift} className="btn btn-ok w-full">
                    <Icon name="send" style={{width:14,height:14}}/> إرسال الهدية 🎁
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: لاعب جديد */}
          {showAddPlayerModal && (
            <div className="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
              <div className="card w-full max-w-md border-[#2b2b30]">
                <div className="px-5 py-4 border-b border-[#232327] flex items-center justify-between">
                  <div className="sec-title"><Icon name="user-plus"/> إنشاء لاعب جديد</div>
                  <button onClick={() => setShowAddPlayerModal(false)} className="text-zinc-500 hover:text-white"><Icon name="x" style={{width:16,height:16}}/></button>
                </div>
                <form onSubmit={handleCreatePlayer} className="p-5 space-y-4">
                  <div>
                    <label className="lbl">اسم اللاعب الكامل</label>
                    <input type="text" required value={newPlayerData.name} onChange={(e) => setNewPlayerData(prev => ({ ...prev, name: e.target.value }))} placeholder="مثال: أحمد المحترف" className="inp" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="lbl">رصيد الرقائق الأولي</label>
                      <input type="number" value={newPlayerData.chips} onChange={(e) => setNewPlayerData(prev => ({ ...prev, chips: e.target.value }))} className="inp" />
                    </div>
                    <div>
                      <label className="lbl">التقييم الأولي</label>
                      <input type="number" value={newPlayerData.rating} onChange={(e) => setNewPlayerData(prev => ({ ...prev, rating: e.target.value }))} className="inp" />
                    </div>
                  </div>
                  <div className="pt-2 flex justify-end gap-2">
                    <button type="button" onClick={() => setShowAddPlayerModal(false)} className="btn btn-sec">إلغاء</button>
                    <button type="submit" className="btn btn-primary">إنشاء الحساب</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: سكن جديد */}
          {showAddSkinModal && (
            <div className="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
              <div className="card w-full max-w-lg border-[#2b2b30] max-h-[90vh] overflow-y-auto">
                <div className="px-5 py-4 border-b border-[#232327] flex items-center justify-between sticky top-0 bg-[#141417] z-10">
                  <div className="sec-title"><Icon name="palette"/> إضافة سكن جديد للمتجر</div>
                  <button onClick={() => setShowAddSkinModal(false)} className="text-zinc-500 hover:text-white"><Icon name="x" style={{width:16,height:16}}/></button>
                </div>
                <form onSubmit={handleAddSkin} className="p-5 space-y-4">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="lbl">اسم التصميم</label>
                      <input type="text" value={newSkin.name} onChange={(e) => setNewSkin(prev => ({ ...prev, name: e.target.value }))} placeholder="مثال: رخام ذهبي" className="inp" />
                    </div>
                    <div>
                      <label className="lbl">السعر</label>
                      <input type="number" min="0" value={newSkin.price} onChange={(e) => setNewSkin(prev => ({ ...prev, price: e.target.value }))} className="inp" />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="lbl">العملة</label>
                      <div className="grid grid-cols-2 gap-2">
                        <button type="button" onClick={() => setNewSkin(p => ({...p, currency: 'chips'}))} className={`btn ${newSkin.currency === 'chips' ? 'btn-primary' : 'btn-sec'}`}>🪙 رقائق</button>
                        <button type="button" onClick={() => setNewSkin(p => ({...p, currency: 'gems'}))} className={`btn ${newSkin.currency === 'gems' ? 'btn-primary' : 'btn-sec'}`}>💎 جواهر</button>
                      </div>
                    </div>
                    <div>
                      <label className="lbl">الفئة (مطابقة لمتجر التطبيق)</label>
                      <select value={newSkin.category} onChange={(e) => setNewSkin(prev => ({ ...prev, category: e.target.value }))} className="inp">
                        {SKIN_CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="lbl">صورة التصميم (PNG)</label>
                    <label className={`flex items-center justify-center gap-2 w-full border-2 border-dashed rounded-lg px-4 py-4 text-sm cursor-pointer transition ${skinImageDataUri ? 'border-indigo-500 bg-indigo-500/5 text-indigo-300' : 'border-[#2b2b30] bg-[#0a0a0c] text-zinc-500 hover:border-indigo-500/50 hover:text-zinc-300'}`}>
                      <input type="file" accept="image/*" className="hidden" onChange={handleStoreFileSelect} />
                      <Icon name="upload" style={{width:15,height:15}}/>
                      {skinImageDataUri ? `تم اختيار: ${skinImageFile?.name}` : 'ارفع صورة التصميم'}
                    </label>
                  </div>

                  <div className="space-y-2">
                    <label className="lbl">معاينة على القطعة (اسحب الصورة لتحريكها)</label>
                    <div
                      className="relative h-44 rounded-xl bg-[#0a0a0c] border border-[#2b2b30] overflow-hidden"
                      style={{ cursor: skinImageDataUri ? 'grab' : 'default', touchAction: 'none' }}
                      onPointerDown={(e) => {
                        if (!skinImageDataUri) return;
                        skinDragRef.current = { x: e.clientX, y: e.clientY, ox: newSkin.ox, oy: newSkin.oy };
                        e.currentTarget.setPointerCapture(e.pointerId);
                      }}
                      onPointerMove={(e) => {
                        const d = skinDragRef.current;
                        if (!d) return;
                        const r = e.currentTarget.getBoundingClientRect();
                        const clamp = (v) => Math.max(-1, Math.min(1, v));
                        setNewSkin(s => ({
                          ...s,
                          ox: clamp(d.ox + (e.clientX - d.x) / (r.width / 2)),
                          oy: clamp(d.oy + (e.clientY - d.y) / (r.height / 2)),
                        }));
                      }}
                      onPointerUp={() => { skinDragRef.current = null; }}
                      onPointerCancel={() => { skinDragRef.current = null; }}
                    >
                      <SkinPreview category={newSkin.category} uri={skinImageDataUri} zoom={newSkin.zoom} ox={newSkin.ox} oy={newSkin.oy} />
                      {!skinImageDataUri && (
                        <div className="absolute inset-0 flex items-center justify-center text-zinc-600 text-xs">ارفع صورة لرؤية المعاينة</div>
                      )}
                    </div>
                    {skinImageDataUri && (
                      <div className="space-y-1.5">
                        <div className="flex items-center gap-2">
                          <span className="text-[10px] text-zinc-500 w-12">تكبير</span>
                          <input type="range" min="0.6" max="3" step="0.05" value={newSkin.zoom}
                            onChange={(e) => setNewSkin(s => ({ ...s, zoom: Number(e.target.value) }))} className="flex-1" />
                          <span className="text-[10px] text-indigo-400 font-bold w-10 text-center">{Math.round(newSkin.zoom * 100)}%</span>
                          <button type="button" onClick={() => setNewSkin(s => ({ ...s, zoom: 1, ox: 0, oy: 0 }))} className="btn btn-sec btn-sm">إعادة</button>
                        </div>
                        <p className="text-[10px] text-zinc-600">اسحب الصورة فوق المعاينة لتحريكها — تُحفظ الإزاحة والتكبير مع التصميم</p>
                      </div>
                    )}
                  </div>

                  <div className="pt-2 flex justify-end gap-2">
                    <button type="button" onClick={() => setShowAddSkinModal(false)} className="btn btn-sec">إلغاء</button>
                    <button type="submit" disabled={savingSkin} className="btn btn-primary">{savingSkin ? 'جارٍ النشر...' : 'نشر التصميم في المتجر'}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: باقة شحن جديدة */}
          {showAddPackModal && (
            <div className="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
              <div className="card w-full max-w-md border-[#2b2b30]">
                <div className="px-5 py-4 border-b border-[#232327] flex items-center justify-between">
                  <div className="sec-title"><Icon name="package"/> باقة شحن جديدة</div>
                  <button onClick={() => setShowAddPackModal(false)} className="text-zinc-500 hover:text-white"><Icon name="x" style={{width:16,height:16}}/></button>
                </div>
                <form onSubmit={handleAddPack} className="p-5 space-y-4">
                  <div>
                    <label className="lbl">اسم الباقة</label>
                    <input type="text" required value={newPack.title} onChange={(e) => setNewPack(prev => ({ ...prev, title: e.target.value }))} placeholder="مثال: باقة الملك الكبرى" className="inp" />
                  </div>
                  <div>
                    <label className="lbl">نوع الرصيد</label>
                    <div className="grid grid-cols-2 gap-2">
                      <button type="button" onClick={() => setNewPack(prev => ({ ...prev, type: 'chips' }))} className={`btn ${newPack.type === 'chips' ? 'btn-primary' : 'btn-sec'}`}>🪙 عملات ذهبية</button>
                      <button type="button" onClick={() => setNewPack(prev => ({ ...prev, type: 'gems' }))} className={`btn ${newPack.type === 'gems' ? 'btn-primary' : 'btn-sec'}`}>💎 مجوهرات زرقاء</button>
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="lbl">الكمية</label>
                      <input type="number" min="1" required value={newPack.amount} onChange={(e) => setNewPack(prev => ({ ...prev, amount: e.target.value }))} className="inp" />
                    </div>
                    <div>
                      <label className="lbl">مكافأة إضافية (bonus)</label>
                      <input type="number" min="0" value={newPack.bonus} onChange={(e) => setNewPack(prev => ({ ...prev, bonus: e.target.value }))} placeholder="0" className="inp" />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="lbl">السعر بالدولار $</label>
                      <input type="number" min="0" step="0.01" required value={newPack.priceUsd} onChange={(e) => setNewPack(prev => ({ ...prev, priceUsd: e.target.value }))} className="inp" />
                    </div>
                    <div>
                      <label className="lbl">شارة الباقة (اختياري)</label>
                      <input type="text" value={newPack.badge} onChange={(e) => setNewPack(prev => ({ ...prev, badge: e.target.value }))} placeholder="مثال: الأكثر مبيعاً" className="inp" />
                    </div>
                  </div>
                  <div className="pt-2 flex justify-end gap-2">
                    <button type="button" onClick={() => setShowAddPackModal(false)} className="btn btn-sec">إلغاء</button>
                    <button type="submit" disabled={savingPack} className="btn btn-primary">{savingPack ? 'جارٍ الإنشاء...' : 'إنشاء الباقة'}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: مجموعة راديو جديدة */}
          {showAddGroupModal && (
            <div className="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
              <div className="card w-full max-w-md border-[#2b2b30]">
                <div className="px-5 py-4 border-b border-[#232327] flex items-center justify-between">
                  <div className="sec-title"><Icon name="folder-plus"/> مجموعة راديو جديدة</div>
                  <button onClick={() => setShowAddGroupModal(false)} className="text-zinc-500 hover:text-white"><Icon name="x" style={{width:16,height:16}}/></button>
                </div>
                <form onSubmit={handleAddRadioGroup} className="p-5 space-y-4">
                  <div className="grid grid-cols-3 gap-3">
                    <div>
                      <label className="lbl">الأيقونة</label>
                      <input type="text" value={newGroup.flag} onChange={(e) => setNewGroup(prev => ({ ...prev, flag: e.target.value }))} className="inp text-center text-lg" />
                    </div>
                    <div className="col-span-2">
                      <label className="lbl">اسم المجموعة</label>
                      <input type="text" required value={newGroup.name} onChange={(e) => setNewGroup(prev => ({ ...prev, name: e.target.value }))} placeholder="مثال: أغاني الطرب" className="inp" />
                    </div>
                  </div>
                  <div className="pt-2 flex justify-end gap-2">
                    <button type="button" onClick={() => setShowAddGroupModal(false)} className="btn btn-sec">إلغاء</button>
                    <button type="submit" className="btn btn-primary">إنشاء المجموعة</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: أغنية جديدة */}
          {showAddSongModal && (
            <div className="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
              <div className="card w-full max-w-md border-[#2b2b30]">
                <div className="px-5 py-4 border-b border-[#232327] flex items-center justify-between">
                  <div className="sec-title"><Icon name="music"/> أغنية / محطة جديدة</div>
                  <button onClick={() => setShowAddSongModal(false)} className="text-zinc-500 hover:text-white"><Icon name="x" style={{width:16,height:16}}/></button>
                </div>
                <form onSubmit={handleAddRadioSong} className="p-5 space-y-4">
                  <div>
                    <label className="lbl">المجموعة</label>
                    <select value={newSong.groupId} onChange={(e) => setNewSong(prev => ({ ...prev, groupId: e.target.value }))} className="inp">
                      <option value="">اختر المجموعة...</option>
                      {radioGroups.map(g => <option key={g.id} value={g.id}>{g.flag} {g.name}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="lbl">اسم الأغنية / المحطة</label>
                    <input type="text" required value={newSong.name} onChange={(e) => setNewSong(prev => ({ ...prev, name: e.target.value }))} placeholder="مثال: إذاعة القرآن الكريم" className="inp" />
                  </div>
                  <div>
                    <label className="lbl">النوع / الوصف (اختياري)</label>
                    <input type="text" value={newSong.genre} onChange={(e) => setNewSong(prev => ({ ...prev, genre: e.target.value }))} placeholder="مثال: طرب، ديني، أخبار" className="inp" />
                  </div>
                  <div>
                    <label className="lbl">ملف صوتي (MP3) — يُرفع إلى Firebase Storage</label>
                    <label className={`flex items-center justify-center gap-2 w-full border-2 border-dashed rounded-lg px-4 py-3 text-sm cursor-pointer transition ${songFile ? 'border-indigo-500 bg-indigo-500/5 text-indigo-300' : 'border-[#2b2b30] bg-[#0a0a0c] text-zinc-500 hover:border-indigo-500/50'}`}>
                      <input type="file" accept="audio/*" className="hidden" onChange={(e) => { const f = e.target.files[0] || null; setSongFile(f); if (f && !newSong.name.trim()) setNewSong(prev => ({ ...prev, name: f.name.replace(/\.[^.]+$/, '') })); }} />
                      <Icon name="upload" style={{width:14,height:14}}/>
                      {songFile ? `${songFile.name} (${(songFile.size / 1048576).toFixed(1)} MB)` : 'اختر ملف صوتي من جهازك'}
                    </label>
                  </div>
                  <div>
                    <label className="lbl">أو رابط بث مباشر (URL) — لمحطات الراديو الحية</label>
                    <input type="url" value={newSong.url} onChange={(e) => setNewSong(prev => ({ ...prev, url: e.target.value }))} placeholder="https://...stream.mp3" dir="ltr" disabled={!!songFile} className="inp text-left" />
                  </div>
                  {songUploadProgress >= 0 && (
                    <div className="space-y-1">
                      <div className="flex justify-between text-[11px] font-bold text-zinc-400">
                        <span>جاري رفع الأغنية...</span>
                        <span className="text-indigo-400">{songUploadProgress}%</span>
                      </div>
                      <div className="w-full h-1.5 bg-[#0a0a0c] rounded-full overflow-hidden">
                        <div className="h-full bg-indigo-500 transition-all duration-300" style={{ width: `${songUploadProgress}%` }}></div>
                      </div>
                    </div>
                  )}
                  <div className="pt-2 flex justify-end gap-2">
                    <button type="button" onClick={() => setShowAddSongModal(false)} className="btn btn-sec">إلغاء</button>
                    <button type="submit" disabled={songUploadProgress >= 0} className="btn btn-primary">{songUploadProgress >= 0 ? 'جاري الرفع...' : 'إضافة الأغنية'}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Toast */}
          {toast && (
            <div className={`fixed bottom-6 left-6 z-[60] px-5 py-3 rounded-lg text-sm font-bold border shadow-2xl ${toast.type === 'error' ? 'bg-rose-950/90 border-rose-500/40 text-rose-300' : 'bg-emerald-950/90 border-emerald-500/40 text-emerald-300'}`}>
              {toast.message}
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AdminApp />);
  </script>
</body>
</html>
