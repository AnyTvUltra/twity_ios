<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <!-- React 18 & Babel for standalone modern dashboard -->

<body class="bg-dark-900 text-gray-100 min-h-screen">

  <!-- Firebase v10 Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      getDoc, 
      getDocs, 
      setDoc, 
      updateDoc, 
      deleteDoc, 
      addDoc, 
      onSnapshot, 
      serverTimestamp, 
      query, 
      orderBy, 
      limit,
      increment,
      where 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBZ1GzN3LUvWxmSf1ZRVC9wDstNNzgJpmw",
      authDomain: "game-651a3.firebaseapp.com",
      projectId: "game-651a3",
      storageBucket: "game-651a3.firebasestorage.app",
      messagingSenderId: "882641594444",
      appId: "1:882641594444:web:177374244ae0d874886ce9",
      measurementId: "G-BJ3SDN2NBK"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // Export to window for React component access
    window.db = db;
    window.fbAuth = auth;
    window.fbAuthTools = { signInWithEmailAndPassword, onAuthStateChanged, signOut };
    window.fbTools = {
      collection, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, addDoc, onSnapshot, serverTimestamp, query, orderBy, limit, increment, where

    window.dispatchEvent(new Event('firebase-ready'));

  <!-- React Application -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // موك اب ثلاثي الأبعاد: معاينة شكل التصميم على القطعة الفعلية حسب الفئة
    // zoom/ox/oy: تكبير وإزاحة الصورة (مطابق لتطبيق اللعبة)
    function SkinPreview({ category, uri, zoom = 1, ox = 0, oy = 0 }) {
      const Img = ({ fallback }) => uri
        ? <img src={uri} alt="" draggable="false" className="w-full h-full block select-none" style={{ objectFit: 'cover', transform: `translate(${ox * 50}%, ${oy * 50}%) scale(${zoom})` }} />
        : <div className="w-full h-full" style={{ background: fallback }}></div>;

      if (category === 'tile') {
        // حجر ثلاثي الأبعاد: وجه + سماكة سفلية + ظل
        const Tile = ({ n, c, tilt }) => (
          <div style={{ transform: `rotate(${tilt}deg)` }} className="flex flex-col items-center">
            <div className="w-12 h-[68px] rounded-t-lg rounded-b-sm border border-[#cbbfa6] relative overflow-hidden" style={{ boxShadow: '2px 4px 8px rgba(0,0,0,.55)' }}>
              <div className="absolute inset-0"><Img fallback="linear-gradient(180deg,#fffdf8,#f3ead5)" /></div>
              <div className="absolute inset-0" style={{ background: 'linear-gradient(180deg,rgba(255,255,255,.35),transparent 45%,rgba(0,0,0,.12))' }}></div>
              <div className="absolute inset-0 flex items-center justify-center font-black text-lg" style={{ color: c, textShadow: '0 0 3px rgba(255,255,255,.7),0 1px 1px rgba(0,0,0,.3)' }}>{n}</div>
            </div>
            <div className="w-12 h-[5px] rounded-b" style={{ background: 'linear-gradient(180deg,#6b5c40,#3a3020)' }}></div>
          </div>
        );
        return (
          <div className="flex items-end justify-center gap-3 h-full pb-3">
            <Tile n="7" c="#d32f2f" tilt={-4} />
            <Tile n="8" c="#1565c0" tilt={0} />
            <Tile n="9" c="#2e7d32" tilt={4} />
          </div>
        );
      }

      if (category === 'table') {
        // طاولة: إطار خشبي شبه منحرف + سطح الكسنة + أحجار مصغرة
        return (
          <div className="flex items-center justify-center h-full relative">
            <div className="w-44 h-24" style={{ clipPath: 'polygon(14% 0,86% 0,100% 100%,0 100%)', background: 'linear-gradient(180deg,#6b3a1c,#4a2410,#2c1205)', boxShadow: '0 8px 16px rgba(0,0,0,.6)' }}>
              <div className="w-full h-full relative" style={{ clipPath: 'polygon(18% 8%,82% 8%,94% 92%,6% 92%)' }}>
                <div className="absolute inset-0"><Img fallback="radial-gradient(circle,#1e5c38,#0b2b18)" /></div>
                <div className="absolute inset-0" style={{ background: 'linear-gradient(180deg,rgba(255,255,255,.1),transparent 40%,rgba(0,0,0,.35))' }}></div>
              </div>
            </div>
            <div className="absolute flex gap-1" style={{ top: '30%' }}>
              {['5', '6', '7'].map(n => (
                <div key={n} className="w-3.5 h-5 rounded-sm bg-[#fffdf8] border border-[#cbbfa6] flex items-center justify-center text-[9px] font-black text-red-600" style={{ boxShadow: '0 1px 2px rgba(0,0,0,.45)' }}>{n}</div>
              ))}
            </div>
          </div>
        );
      }

      if (category === 'rack') {
        // استكانة: الكسنة تغطي كامل الجسم + لوح علوي + أحجار واقفة + حافة سفلية
        const nums = ['3', '4', '5', '7', '7', '9', '11'];
        const cols = ['#1565c0', '#1565c0', '#1565c0', '#d32f2f', '#2e7d32', '#2e7d32', '#e65100'];
        return (
          <div className="flex items-end justify-center h-full pb-2">
            <div className="w-48 h-24 rounded-md relative overflow-hidden" style={{ boxShadow: '0 6px 14px rgba(0,0,0,.6)' }}>
              <div className="absolute inset-0"><Img fallback="linear-gradient(180deg,#5a2e16,#45220f,#241006)" /></div>
              {uri && <div className="absolute inset-0" style={{ background: 'rgba(0,0,0,.12)' }}></div>}
              <div className="absolute top-0 inset-x-0 h-7" style={{ background: 'linear-gradient(180deg,rgba(66,32,14,.55),rgba(46,21,8,.7))', borderBottom: '1.5px solid #1b0b04' }}></div>
              <div className="absolute inset-x-2 bottom-1.5 flex gap-1 items-stretch" style={{ top: '30px' }}>
                {nums.map((n, i) => (
                  <div key={i} className="flex-1 h-full rounded-sm bg-[#fffdf8] border border-[#cbbfa6] flex items-center justify-center text-[10px] font-black" style={{ color: cols[i], boxShadow: '0 2px 2px rgba(0,0,0,.35)' }}>{n}</div>
                ))}
              </div>
              <div className="absolute bottom-0 inset-x-0 h-1" style={{ background: 'linear-gradient(90deg,rgba(25,8,2,.7),rgba(56,25,10,.7),rgba(25,8,2,.7))' }}></div>
            </div>
          </div>
        );
      }

      if (category === 'frame') {
        // إطار الصورة الشخصية: صورة رمزية + إطار الكسنة حولها
        return (
          <div className="flex items-center justify-center h-full">
            <div className="relative w-24 h-24 flex items-center justify-center">
              <div className="w-14 h-14 rounded-full flex items-center justify-center text-2xl" style={{ background: 'linear-gradient(135deg,#60a5fa,#3b82f6)', boxShadow: '0 4px 10px rgba(0,0,0,.4)' }}>🀄</div>
              <div className="absolute inset-0">
                {uri
                  ? <img src={uri} alt="" draggable="false" className="w-full h-full block select-none" style={{ objectFit: 'cover', transform: `translate(${ox * 50}%, ${oy * 50}%) scale(${zoom})` }} />
                  : <div className="w-full h-full rounded-full border-4 border-amber-400"></div>}
              </div>
            </div>
          </div>
        );
      }

      if (category === 'chessBoard') {
        // لوحة شطرنج: إطار خشبي + نسيج الكسنة + تناوب المربعات فوقه
        return (
          <div className="flex items-center justify-center h-full">
            <div className="w-32 h-32 rounded-md p-2 relative" style={{ background: 'linear-gradient(135deg,#6b4423,#3a2110,#241505)', boxShadow: '0 8px 18px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,217,160,.4)' }}>
              <div className="w-full h-full relative overflow-hidden rounded-sm">
                <div className="absolute inset-0"><Img fallback="linear-gradient(135deg,#f0d9b5,#b07b4a)" /></div>
                <div className="absolute inset-0" style={{ background: 'conic-gradient(rgba(245,230,196,.30) 0 25%, rgba(36,21,5,.55) 0 50%, rgba(245,230,196,.30) 0 75%, rgba(36,21,5,.55) 0)', backgroundSize: '50% 50%' }}></div>
                <div className="absolute inset-0" style={{ background: 'linear-gradient(135deg,rgba(255,255,255,.14),transparent 50%,rgba(0,0,0,.18))' }}></div>
              </div>
              <div className="absolute -bottom-1 inset-x-2 h-2 rounded-b" style={{ background: 'linear-gradient(180deg,#3a2110,#1a0d04)' }}></div>
            </div>
          </div>
        );
      }

      if (category === 'chessPieces') {
        // أحجار شطرنج: الرموز تُملأ بنسيج الكسنة
        const piece = (g, tint) => (
          <span style={{
            fontSize: '64px', lineHeight: 1, fontWeight: '900',
            backgroundImage: uri ? `url(${uri})` : 'none',
            backgroundSize: 'cover', backgroundPosition: 'center',
            WebkitBackgroundClip: uri ? 'text' : 'border-box',
            backgroundClip: uri ? 'text' : 'border-box',
            color: uri ? 'transparent' : tint,
            filter: `drop-shadow(0 3px 2px rgba(0,0,0,.6))${uri ? ` drop-shadow(0 0 0 ${tint})` : ''}`,
          }}>{g}</span>
        );
        return (
          <div className="flex items-center justify-center gap-6 h-full">
            <div className="relative">
              {piece('♞', '#fff6dc')}
              {!uri && <span className="absolute inset-0 flex items-center justify-center" style={{ color: '#fff6dc', fontSize: '64px' }}></span>}
            </div>
            {piece('♛', '#4a1f30')}
          </div>
        );
      }

      // background: مشهد كامل — الخلفية + طاولة مصغرة + استكانة
      return (
        <div className="absolute inset-0 rounded-xl overflow-hidden">
          <div className="absolute inset-0"><Img fallback="radial-gradient(circle,#17171b,#030509)" /></div>
          <div className="absolute inset-0" style={{ background: 'linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.45))' }}></div>
          <div className="absolute inset-x-0 top-1/3 flex justify-center">
            <div className="w-28 h-14" style={{ clipPath: 'polygon(14% 0,86% 0,100% 100%,0 100%)', background: 'linear-gradient(180deg,#6b3a1c,#2c1205)' }}></div>
          </div>
          <div className="absolute inset-x-0 bottom-2 flex justify-center">
            <div className="w-32 h-4 rounded" style={{ background: 'linear-gradient(180deg,#5a2e16,#241006)' }}></div>
          </div>
        </div>
      );
    }

    function AdminApp() {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [authChecking, setAuthChecking] = useState(true);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [pinError, setPinError] = useState('');
      const [loggingIn, setLoggingIn] = useState(false);
      const [activeTab, setActiveTab] = useState('overview'); // overview, players, economy, settings, history
      const [fbStatus, setFbStatus] = useState('connecting'); // connecting, ready, error

      // Data states
      const [players, setPlayers] = useState([]);
      const [gameSettings, setGameSettings] = useState({
        startingChips: 1250,
        defaultTurnTimer: 72,
        botDifficulty: 'medium',
        maintenanceMode: false,
        announcement: 'مرحباً بكم في مجتمع الألعاب الممتعة!'
      });
      const [gameLogs, setGameLogs] = useState([]);
      const [searchQuery, setSearchQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('all');
      const [storeItems, setStoreItems] = useState([]);
      const [reports, setReports] = useState([]);
      const [tickets, setTickets] = useState([]);
      const [skinFilter, setSkinFilter] = useState('all');
      const [showAddSkinModal, setShowAddSkinModal] = useState(false);
      const [newSkin, setNewSkin] = useState({ name: '', category: 'tile', price: 500, currency: 'chips', zoom: 1, ox: 0, oy: 0 });
      const skinDragRef = React.useRef(null);
      const [skinImageB64, setSkinImageB64] = useState('');
      const [skinImageDataUri, setSkinImageDataUri] = useState('');
      const [savingSkin, setSavingSkin] = useState(false);

      // الشحن والباقات + الراديو
      const [coinPacks, setCoinPacks] = useState([]);
      const [orders, setOrders] = useState([]);
      const [showAddPackModal, setShowAddPackModal] = useState(false);
      const [newPack, setNewPack] = useState({ title: '', type: 'chips', amount: 5000, priceUsd: 4.99 });
      const [savingPack, setSavingPack] = useState(false);
      const [radioGroups, setRadioGroups] = useState([]);
      const [radioSongs, setRadioSongs] = useState([]);
      const [showAddGroupModal, setShowAddGroupModal] = useState(false);
      const [showAddSongModal, setShowAddSongModal] = useState(false);
      const [newGroup, setNewGroup] = useState({ name: '', flag: '🎵' });
      const [newSong, setNewSong] = useState({ groupId: '', name: '', genre: '', url: '' });
      const [selectedRadioGroup, setSelectedRadioGroup] = useState('all');

      // Modals
      const [editingPlayer, setEditingPlayer] = useState(null);
      const [editCurrency, setEditCurrency] = useState('chips');
      const [showAddPlayerModal, setShowAddPlayerModal] = useState(false);
      const [newPlayerData, setNewPlayerData] = useState({ name: '', chips: 5000, rating: 1200, level: 1 });
      const [toastMsg, setToastMsg] = useState(null);
      const [broadcast, setBroadcast] = useState({ title: '📢 إشعار', body: '' });
      const [broadcasts, setBroadcasts] = useState([]);
      const [sendingBroadcast, setSendingBroadcast] = useState(false);

      const showToast = (text, type = 'success') => {
        setToastMsg({ text, type });
        setTimeout(() => setToastMsg(null), 3500);
      };

      // استعادة الجلسة + التحقق من صلاحية الأدمن عبر مجموعة admins
      useEffect(() => {
        if (!window.fbAuth || !window.fbAuthTools) return;
        const { onAuthStateChanged } = window.fbAuthTools;
        const { doc, getDoc } = window.fbTools;
        const unsub = onAuthStateChanged(window.fbAuth, async (u) => {
          if (u) {
            try {
              const adminDoc = await getDoc(doc(window.db, 'admins', u.uid));
              setIsAuthenticated(adminDoc.exists());
              if (!adminDoc.exists()) window.fbAuthTools.signOut(window.fbAuth);
            } catch (e) {
              setIsAuthenticated(false);
            }
          } else {
            setIsAuthenticated(false);
          }
          setAuthChecking(false);
        });
        return () => unsub();
      }, []);

      // تسجيل دخول حقيقي: إيميل + كلمة مرور + التحقق من مجموعة admins
      const handleLogin = async (e) => {
        e && e.preventDefault();
        if (!email.trim() || !password) {
          setPinError('أدخل البريد الإلكتروني وكلمة المرور');
          return;
        }
        setLoggingIn(true);
        setPinError('');
        try {
          const { signInWithEmailAndPassword, signOut } = window.fbAuthTools;
          const { doc, getDoc } = window.fbTools;
          const cred = await signInWithEmailAndPassword(window.fbAuth, email.trim(), password);
          const adminDoc = await getDoc(doc(window.db, 'admins', cred.user.uid));
          if (adminDoc.exists()) {
            setIsAuthenticated(true);
            showToast('تم تسجيل الدخول بنجاح! مرحباً بالمدير.');
          } else {
            await signOut(window.fbAuth);
            setPinError('⛔ هذا الحساب لا يملك صلاحيات الإدارة');
          }
        } catch (err) {
          setPinError('بيانات الدخول غير صحيحة أو الحساب غير موجود');
        } finally {
          setLoggingIn(false);
        }
      };

      const handleLogout = () => {
        if (window.fbAuthTools) window.fbAuthTools.signOut(window.fbAuth);
        setIsAuthenticated(false);
        setEmail('');
        setPassword('');
      };

      // Set up Realtime Firebase listeners
      useEffect(() => {
        if (!isAuthenticated) return;

        const initFirebaseListeners = () => {
          if (!window.db || !window.fbTools) return;
          const { collection, doc, onSnapshot, query, orderBy, limit } = window.fbTools;
          setFbStatus('ready');

          // 1. Users listener (الحسابات الحقيقية في مجموعة users)
          try {
            const playersRef = collection(window.db, 'users');
            const unsubPlayers = onSnapshot(playersRef, (snapshot) => {
              const list = [];
              snapshot.forEach((doc) => {
                const d = doc.data();
                list.push({ id: doc.id, ...d, name: d.displayName || d.username || d.name || 'لاعب' });
              });
              setPlayers(list);
            }, (err) => {
              console.error("Users listener error:", err);
            });

            // 2. Settings listener
            const settingsDoc = doc(window.db, 'config', 'game_settings');
            const unsubSettings = onSnapshot(settingsDoc, (docSnap) => {
              if (docSnap.exists()) {
                setGameSettings(prev => ({ ...prev, ...docSnap.data() }));
              }
            }, (err) => {
              console.error("Settings listener error:", err);
            });

            // 3. Game history listener
            try {
              const historyQuery = query(collection(window.db, 'game_history'), orderBy('timestamp', 'desc'), limit(50));
              const unsubHistory = onSnapshot(historyQuery, (snapshot) => {
                const logs = [];
                snapshot.forEach((doc) => {
                  logs.push({ id: doc.id, ...doc.data() });
                });
                setGameLogs(logs);
              }, (err) => {
                // If index not ready, fall back to simple collection listener
                const fallbackRef = collection(window.db, 'game_history');
                onSnapshot(fallbackRef, (snap) => {
                  const fallbackLogs = [];
                  snap.forEach(d => fallbackLogs.push({ id: d.id, ...d.data() }));
                  setGameLogs(fallbackLogs.reverse());
                });
              });
            } catch (e) {
              console.warn(e);
            }

            // 4. Store items listener (المتجر والسكنات)
            const unsubStore = onSnapshot(collection(window.db, 'store_items'), (snap) => {
              const list = [];
              snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
              list.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
              setStoreItems(list);
            }, (err) => console.error("Store listener error:", err));

            // 5. Reports listener (البلاغات)
            const unsubReports = onSnapshot(collection(window.db, 'reports'), (snap) => {
              const list = [];
              snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
              list.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
              setReports(list);
            }, (err) => console.error("Reports listener error:", err));

            // 6. Support tickets listener (تذاكر الدعم)
            const unsubTickets = onSnapshot(collection(window.db, 'support_tickets'), (snap) => {
              const list = [];
              snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
              list.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
              setTickets(list);
            }, (err) => console.error("Tickets listener error:", err));

            // 7. باقات الشحن (coin_packs)
            const unsubPacks = onSnapshot(collection(window.db, 'coin_packs'), (snap) => {
              const list = [];
              snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
              list.sort((a, b) => (a.sort ?? 999) - (b.sort ?? 999));
              setCoinPacks(list);
            }, (err) => console.error("Packs listener error:", err));

            // 8. طلبات الشحن (orders)
            const unsubOrders = onSnapshot(collection(window.db, 'orders'), (snap) => {
              const list = [];
              snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
              list.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
              setOrders(list);
            }, (err) => console.error("Orders listener error:", err));

            // 9. مجموعات الراديو + الأغاني
            const unsubRadioGroups = onSnapshot(collection(window.db, 'radio_groups'), (snap) => {
              const list = [];

                        if (!d) return;
                        const r = e.currentTarget.getBoundingClientRect();
                        const clamp = (v) => Math.max(-1, Math.min(1, v));
                        setNewSkin(s => ({
                          ...s,
                          ox: clamp(d.ox + (e.clientX - d.x) / (r.width / 2)),
                          oy: clamp(d.oy + (e.clientY - d.y) / (r.height / 2)),
                        }));
                      }}
                      onPointerUp={() => { skinDragRef.current = null; }}
                      onPointerCancel={() => { skinDragRef.current = null; }}
                    >
                      <SkinPreview
                        category={newSkin.category}
                        uri={skinImageDataUri}
                        zoom={newSkin.zoom}
                        ox={newSkin.ox}
                        oy={newSkin.oy}
                      />
                      {!skinImageDataUri && (
                        <div className="absolute inset-0 flex items-center justify-center text-gray-600 text-xs">ارفع صورة لرؤية المعاينة</div>
                      )}
                    </div>
                    {skinImageDataUri && (
                      <div className="space-y-1.5">
                        <div className="flex items-center gap-2">
                          <span className="text-[10px] text-gray-400 w-14">تكبير 🔍</span>
                          <input
                            type="range" min="0.6" max="3" step="0.05"
                            value={newSkin.zoom}
                            onChange={(e) => setNewSkin(s => ({ ...s, zoom: Number(e.target.value) }))}
                            className="flex-1 accent-emerald-500"
                          />
                          <span className="text-[10px] text-emerald-400 font-bold w-10 text-center">{Math.round(newSkin.zoom * 100)}%</span>
                          <button
                            type="button"
                            onClick={() => setNewSkin(s => ({ ...s, zoom: 1, ox: 0, oy: 0 }))}
                            className="px-2 py-1 text-[10px] font-bold rounded-lg bg-gray-700/60 text-gray-300 hover:bg-gray-600 transition"
                          >
                            ↺ إعادة ضبط
                          </button>
                        </div>
                        <p className="text-[10px] text-gray-500">اسحب الصورة فوق المعاينة لتحريكها • استخدم المنزلق للتكبير والتصغير — الصورة تغطي كامل القطعة</p>
                      </div>
                    )}
                  </div>

                  <div className="pt-2 flex justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setShowAddSkinModal(false)}
                      className="px-4 py-2.5 text-xs text-gray-400 hover:text-white font-bold rounded-xl"
                    >
                      إلغاء
                    </button>
                    <button
                      type="submit"
                      disabled={savingSkin}
                      className="px-6 py-2.5 bg-emerald-500 hover:bg-emerald-600 disabled:opacity-50 text-white font-bold text-xs rounded-xl shadow-lg shadow-emerald-500/20 transition"
                    >
                      {savingSkin ? 'جارٍ النشر...' : '🚀 نشر التصميم في المتجر'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: ADD COIN/GEM PACK */}
          {showAddPackModal && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-card rounded-2xl w-full max-w-md border border-gray-700 shadow-2xl">
                <div className="p-5 border-b border-gray-800 flex items-center justify-between">
                  <h3 className="font-bold text-white">باقة شحن جديدة 💰</h3>
                  <button onClick={() => setShowAddPackModal(false)} className="text-gray-400 hover:text-white">✕</button>
                </div>
                <form onSubmit={handleAddPack} className="p-5 space-y-4">
                  <div>
                    <label className="text-xs font-bold text-gray-300 block mb-1">اسم الباقة</label>
                    <input type="text" value={newPack.title} onChange={(e) => setNewPack(prev => ({ ...prev, title: e.target.value }))} placeholder="مثال: باقة الملك الكبرى" className="w-full bg-dark-800 border border-gray-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-emerald-500" />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-gray-300 block mb-1">نوع الرصيد</label>
                    <div className="grid grid-cols-2 gap-3">
                      <button type="button" onClick={() => setNewPack(prev => ({ ...prev, type: 'chips' }))} className={`py-2.5 rounded-xl font-bold text-sm border transition ${newPack.type === 'chips' ? 'bg-amber-500/15 text-amber-300 border-amber-400' : 'bg-dark-800 text-gray-400 border-gray-700'}`}>🪙 عملات ذهبية</button>
                      <button type="button" onClick={() => setNewPack(prev => ({ ...prev, type: 'gems' }))} className={`py-2.5 rounded-xl font-bold text-sm border transition ${newPack.type === 'gems' ? 'bg-sky-500/15 text-sky-300 border-sky-400' : 'bg-dark-800 text-gray-400 border-gray-700'}`}>💎 مجوهرات زرقاء</button>
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-bold text-gray-300 block mb-1">الكمية ({newPack.type === 'gems' ? 'جواهر 💎' : 'عملات 🪙'})</label>
                      <input type="number" min="1" value={newPack.amount} onChange={(e) => setNewPack(prev => ({ ...prev, amount: e.target.value }))} className={`w-full bg-dark-800 border border-gray-700 rounded-xl px-4 py-2.5 font-bold text-sm focus:outline-none ${newPack.type === 'gems' ? 'text-sky-300' : 'text-amber-400'}`} />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-gray-300 block mb-1">السعر بالدولار $</label>
                      <input type="number" min="0" step="0.01" value={newPack.priceUsd} onChange={(e) => setNewPack(prev => ({ ...prev, priceUsd: e.target.value }))} className="w-full bg-dark-800 border border-gray-700 rounded-xl px-4 py-2.5 text-emerald-400 font-bold text-sm focus:outline-none focus:border-emerald-500" />
                    </div>
                  </div>
                  <div className="pt-2 flex justify-end gap-2">
                    <button type="button" onClick={() => setShowAddPackModal(false)} className="px-4 py-2.5 text-xs text-gray-400 hover:text-white font-bold rounded-xl">إلغاء</button>
                    <button type="submit" disabled={savingPack} className="px-6 py-2.5 bg-emerald-500 hover:bg-emerald-600 disabled:opacity-50 text-white font-bold text-xs rounded-xl transition">{savingPack ? 'جارٍ الإنشاء...' : '🚀 إنشاء الباقة'}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: ADD RADIO GROUP */}
          {showAddGroupModal && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-card rounded-2xl w-full max-w-md border border-gray-700 shadow-2xl">
                <div className="p-5 border-b border-gray-800 flex items-center justify-between">
                  <h3 className="font-bold text-white">مجموعة راديو جديدة 📻</h3>
                  <button onClick={() => setShowAddGroupModal(false)} className="text-gray-400 hover:text-white">✕</button>
                </div>
                <form onSubmit={handleAddRadioGroup} className="p-5 space-y-4">
                  <div className="grid grid-cols-3 gap-3">
                    <div>
                      <label className="text-xs font-bold text-gray-300 block mb-1">الأيقونة</label>
                      <input type="text" value={newGroup.flag} onChange={(e) => setNewGroup(prev => ({ ...prev, flag: e.target.value }))} className="w-full bg-dark-800 border border-gray-700 rounded-xl px-4 py-2.5 text-white text-center text-lg focus:outline-none focus:border-emerald-500" />
                    </div>
                    <div className="col-span-2">
                      <label className="text-xs font-bold text-gray-300 block mb-1">اسم المجموعة</label>
                      <input type="text" value={newGroup.name} onChange={(e) => setNewGroup(prev => ({ ...prev, name: e.target.value }))} placeholder="مثال: أغاني الطرب" className="w-full bg-dark-800 border border-gray-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-emerald-500" />
                    </div>
                  </div>
                  <div className="pt-2 flex justify-end gap-2">
                    <button type="button" onClick={() => setShowAddGroupModal(false)} className="px-4 py-2.5 text-xs text-gray-400 hover:text-white font-bold rounded-xl">إلغاء</button>
                    <button type="submit" className="px-6 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xs rounded-xl transition">إنشاء المجموعة</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: ADD RADIO SONG */}
          {showAddSongModal && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-card rounded-2xl w-full max-w-md border border-gray-700 shadow-2xl">
                <div className="p-5 border-b border-gray-800 flex items-center justify-between">
                  <h3 className="font-bold text-white">أغنية جديدة 🎶</h3>
                  <button onClick={() => setShowAddSongModal(false)} className="text-gray-400 hover:text-white">✕</button>
                </div>
                <form onSubmit={handleAddRadioSong} className="p-5 space-y-4">
                  <div>
                    <label className="text-xs font-bold text-gray-300 block mb-1">المجموعة</label>
                    <select value={newSong.groupId} onChange={(e) => setNewSong(prev => ({ ...prev, groupId: e.target.value }))} className="w-full bg-dark-800 border border-gray-700 text-gray-200 text-sm rounded-xl px-4 py-2.5 focus:outline-none focus:border-emerald-500">
                      <option value="">اختر المجموعة...</option>
                      {radioGroups.map(g => <option key={g.id} value={g.id}>{g.flag} {g.name}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-bold text-gray-300 block mb-1">اسم الأغنية / المحطة</label>
                    <input type="text" value={newSong.name} onChange={(e) => setNewSong(prev => ({ ...prev, name: e.target.value }))} placeholder="مثال: إذاعة القرآن الكريم" className="w-full bg-dark-800 border border-gray-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-emerald-500" />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-gray-300 block mb-1">النوع / الوصف (اختياري)</label>
                    <input type="text" value={newSong.genre} onChange={(e) => setNewSong(prev => ({ ...prev, genre: e.target.value }))} placeholder="مثال: طرب، ديني، أخبار" className="w-full bg-dark-800 border border-gray-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-emerald-500" />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-gray-300 block mb-1">رابط البث / الأغنية (URL)</label>
                    <input type="url" value={newSong.url} onChange={(e) => setNewSong(prev => ({ ...prev, url: e.target.value }))} placeholder="https://...stream.mp3" dir="ltr" className="w-full bg-dark-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sky-300 text-sm focus:outline-none focus:border-sky-500" />
                  </div>
                  <div className="pt-2 flex justify-end gap-2">
                    <button type="button" onClick={() => setShowAddSongModal(false)} className="px-4 py-2.5 text-xs text-gray-400 hover:text-white font-bold rounded-xl">إلغاء</button>
                    <button type="submit" className="px-6 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xs rounded-xl transition">إضافة الأغنية</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AdminApp />);
  </script>
</body>
</html>
