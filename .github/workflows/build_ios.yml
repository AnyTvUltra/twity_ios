name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📱 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📁 Prepare Build Directories
        run: |
          mkdir -p build/ios/SourcePackages
          mkdir -p build/ios/iphoneos

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🍎 Install CocoaPods Dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: 🔨 Build iOS (Unsigned Release)
        run: flutter build ios --release --no-codesign

      - name: 📦 Package into IPA (Payload Format)
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -qr ../../../app-release.ipa Payload
          cd ../../..
          ls -lh app-release.ipa

      - name: 🚀 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YallaYari-iOS-IPA
          path: app-release.ipa
          retention-days: 14
